version: '3.8'
services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=rupayan
      - POSTGRES_DB=social_network
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: backend
    build: 
      context: .
      dockerfile: ./apps/backend/Dockerfile
      
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - 3000:3000
    networks:
      - app_network
      - db_network


  frontend:
    container_name: frontend
    build: 
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - backend
    ports:
      - 5173:5173
    networks:
      - app_network

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - db_network
    
  
networks:
  db_network:
    driver: bridge

  app_network:

volumes:
  postgres_data: