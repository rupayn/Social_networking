version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rupayan
      POSTGRES_DB: social_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./.env
    # make sure your backend listens on 0.0.0.0:3000 inside the container
    ports:
      - "3000:3000"
    networks:
      - app_network
      - db_network
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - /app/node_modules
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - backend
    # adjust if your frontend uses another port
    ports:
      - "5173:5173"
    networks:
      - app_network
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
      - /app/node_modules

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - db_network

networks:
  db_network:
    driver: bridge
  app_network:
    driver: bridge

volumes:
  postgres_data:
